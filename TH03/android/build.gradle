buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// @react-native-community/geolocation dùng buildConfigField nhưng không bật
// buildFeatures.buildConfig, mà AGP 9 tắt tính năng này theo mặc định
subprojects { subproject ->
    if (subproject.name == "react-native-community_geolocation") {
        subproject.plugins.withId("com.android.library") {
            subproject.android.buildFeatures.buildConfig = true
        }
    }
}
